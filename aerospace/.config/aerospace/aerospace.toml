# =========================================================
# AeroSpace – Clean & Modern Config (14" MacBook Pro)
# Author: Ajay Mahar
# Focus: Coding, small-screen multitasking, predictability
# =========================================================

# ---------------------------------------------------------
# Startup
# ---------------------------------------------------------
start-at-login = false

after-login-command = []

after-startup-command = [
  'exec-and-forget /usr/local/bin/sketchybar',
  'workspace T',
  'exec-and-forget open -a Ghostty',
  'exec-and-forget open -a Safari'
]

exec-on-workspace-change = [
  '/bin/bash',
  '-c',
  '/usr/local/bin/sketchybar --trigger aerospace_workspace_change AEROSPACE_FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE AEROSPACE_PREV_WORKSPACE=$AEROSPACE_PREV_WORKSPACE',
]

# ---------------------------------------------------------
# Normalization (keep layouts same)
# ---------------------------------------------------------
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# ---------------------------------------------------------
# Layout Defaults
# ---------------------------------------------------------
accordion-padding = 40
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

# ---------------------------------------------------------
# Key Mapping
# ---------------------------------------------------------
key-mapping.preset = 'qwerty'

# ---------------------------------------------------------
# Gaps (Optimized for 14" screen)
# ---------------------------------------------------------
[gaps]
inner.horizontal = 8
inner.vertical   = 8
outer.left       = 8
outer.right      = 8
outer.bottom     = 8
outer.top        = 10

# =========================================================
# MAIN MODE
# =========================================================
[mode.main.binding]

# ---------------------------------------------------------
# Layout toggles
# ---------------------------------------------------------
alt-slash  = 'layout tiles horizontal vertical'
alt-comma  = 'layout accordion horizontal vertical'
alt-v      = 'layout tiles vertical'
# alt-h      = 'layout tiles horizontal'

# ---------------------------------------------------------
# Focus movement (vim-style)
# ---------------------------------------------------------
alt-h = 'focus left'
alt-j = 'focus down'
alt-k = 'focus up'
alt-l = 'focus right'

# ---------------------------------------------------------
# Move windows
# ---------------------------------------------------------
alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

# ---------------------------------------------------------
# Resize (coarse on purpose for small screens)
# ---------------------------------------------------------
alt-shift-minus = 'resize smart -50'
alt-shift-equal = 'resize smart +50'

# ---------------------------------------------------------
# Workspaces (Role-based)
# ---------------------------------------------------------
# T = Terminal
# C = Code
# B = Browser
# G = Git
# M = Misc (Slack, Notes, etc)
# D = (Docs, PR, etc)


alt-t = 'workspace T'
alt-c = 'workspace C'
alt-b = 'workspace B'
alt-g = 'workspace G'
alt-m = 'workspace M'
alt-d = 'workspace D'

alt-shift-t = 'move-node-to-workspace T'
alt-shift-c = 'move-node-to-workspace C'
alt-shift-b = 'move-node-to-workspace B'
alt-shift-g = 'move-node-to-workspace G'
alt-shift-m = 'move-node-to-workspace M'
alt-shift-d = 'move-node-to-workspace D'

# ---------------------------------------------------------
# Workspace navigation
# ---------------------------------------------------------
alt-tab        = 'workspace-back-and-forth'
alt-shift-tab  = 'move-workspace-to-monitor --wrap-around next'

# ---------------------------------------------------------
# Focus / Zen / Fullscreen
# ---------------------------------------------------------
alt-shift-f = 'fullscreen'
alt-z       = 'close-all-windows-but-current'
alt-q = 'close'

# ---------------------------------------------------------
# Modes
# ---------------------------------------------------------
alt-semicolon = 'mode service'

# =========================================================
# SERVICE MODE (Layout maintenance)
# =========================================================
[mode.service.binding]

esc = ['reload-config', 'mode main']
r   = ['flatten-workspace-tree', 'mode main']
f   = ['layout floating tiling', 'mode main']
x   = ['close-all-windows-but-current', 'mode main']
backspace = ['close-all-windows-but-current', 'mode main']

alt-shift-h = ['join-with left', 'mode main']
alt-shift-j = ['join-with down', 'mode main']
alt-shift-k = ['join-with up', 'mode main']
alt-shift-l = ['join-with right', 'mode main']

# =========================================================
# AUTO WINDOW ROUTING
# =========================================================

# -----------------------
# Terminal
# -----------------------
[[on-window-detected]]
if.app-id = 'com.mitchellh.ghostty'
run = [
 'move-node-to-workspace T',
 'layout tiles horizontal'
 ]

[[on-window-detected]]
if.app-id = 'com.apple.Terminal'
run = [
 'move-node-to-workspace T',
 'layout tiles horizontal'
 ]

[[on-window-detected]]
if.app-id = 'com.github.wez.wezterm'
run = [
 'move-node-to-workspace T',
 'layout tiles horizontal'
 ]

# -----------------------
# Code
# -----------------------
[[on-window-detected]]
if.app-id = 'com.microsoft.VSCode'
run = 'move-node-to-workspace C'

# -----------------------
# Browser
# -----------------------
[[on-window-detected]]
if.app-id = 'com.apple.Safari'
run = [
 'move-node-to-workspace B',
 'layout tiles vertical'
 ]

[[on-window-detected]]
if.app-id = 'org.mozilla.firefox'
run = 'move-node-to-workspace B'

[[on-window-detected]]
if.app-id = 'com.google.Chrome'
run = 'move-node-to-workspace B'

# -----------------------
# Git / Tools
# -----------------------
[[on-window-detected]]
if.app-id = 'com.github.GitHubClient'
run = 'move-node-to-workspace G'

# -----------------------
# Misc
# -----------------------
[[on-window-detected]]
if.app-id = 'com.tinyspeck.slackmacgap'
run = 'move-node-to-workspace M'

# -----------------------
# Docs/PR
# -----------------------
[[on-window-detected]]
if.app-id = 'com.apple.finder'
run = 'move-node-to-workspace D'

[[on-window-detected]]
if.app-id = 'com.apple.Preview'
run = 'move-node-to-workspace D'

# -----------------------
# floating windows
# -----------------------
[[on-window-detected]]
if.app-id = 'com.1password.1password'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.SystemPreferences'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.ActivityMonitor'
run = 'layout floating'
